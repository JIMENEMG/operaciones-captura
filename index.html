<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operaciones - Captura | Portal TI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    .rotate-180 { transform: rotate(180deg); }
  </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

  <div class="flex h-screen overflow-hidden relative">
    
    <!-- FONDO OSCURO PARA MÓVILES -->
    <div id="sidebarOverlay" onclick="toggleMobileMenu()" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

    <!-- COLUMNA LATERAL (Menú) -->
    <aside id="sidebar" class="w-80 bg-gray-900 text-gray-200 flex flex-col shadow-xl border-r border-gray-800 absolute z-40 h-full transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:translate-x-0">
      
      <div class="p-5 border-b border-gray-800 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <svg class="w-7 h-7 text-blue-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-4v-3m-6 3h2m6 0h1m-4-10v4h4V4h-4zm-8 10v4h4v-4H4zm0-10v4h4V4H4z"/>
          </svg>
          <div>
            <h1 class="font-bold text-lg leading-tight text-white">Operaciones</h1>
            <p class="text-xs text-gray-400">Portal de Perfiles TI</p>
          </div>
        </div>
        <button onclick="toggleMobileMenu()" class="md:hidden text-gray-400 hover:text-white focus:outline-none">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="p-4 border-t border-gray-800 text-xs text-gray-500 text-center mt-auto">
        Soporte TI Zebra
      </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 bg-gray-100 flex flex-col h-screen overflow-hidden">
      
      <!-- HEADER MÓVIL -->
      <div class="md:hidden flex items-center justify-between bg-gray-900 text-white p-4 shadow-md z-20">
        <div class="flex items-center space-x-2">
          <span class="font-bold text-lg">Catálogo TI</span>
        </div>
        <button onclick="toggleMobileMenu()" class="text-gray-300 hover:text-white focus:outline-none">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-4 md:p-8">
        <div class="max-w-5xl mx-auto">
          <div id="profilesGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-6"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTk7YGRsakUc1KwxUn867SSGdiVILgQPMumYKiu_VZ9kz3EXhqGhWbsNp3M-5Uoe1lgz5nJZQB04VG1/pub?gid=0&single=true&output=csv';

    let globalData = [];

    function toggleMobileMenu() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('sidebarOverlay').classList.toggle('hidden');
    }

    function loadGoogleSheetsData() {
      Papa.parse(SHEET_CSV_URL + '&t=' + new Date().getTime(), {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          processRawData(results.data);
          renderProfiles();
        }
      });
    }

    function processRawData(rows) {
      const mapClientes = {};
      rows.forEach(row => {
        const cId = (row.cliente_id || '').trim();
        if (!cId) return;
        const subId = (row.subcarpeta_id || 'GENERAL').trim();

        if (!mapClientes[cId]) mapClientes[cId] = { id: cId, nombre: row.cliente_nombre, subcarpetas: {} };
        if (!mapClientes[cId].subcarpetas[subId]) mapClientes[cId].subcarpetas[subId] = { id: subId, nombre: row.subcarpeta_nombre, modelos: [] };

        mapClientes[cId].subcarpetas[subId].modelos.push({
          id_modelo: row.modelo_id,
          nombre_modelo: row.modelo_nombre,
          tipo_badge: row.badge_texto,
          color_badge: row.badge_color,
          android: row.android,
          mx: row.mx,
          build: row.build,
          wifi: row.wifi,
          apps: row.apps,
          foto_url: row.foto_url,
          pdf_url: row.pdf_url,
          archivos_url: row.archivos_url 
        });
      });
      globalData = Object.values(mapClientes);
    }

    function renderProfiles() {
      const grid = document.getElementById('profilesGrid');
      grid.innerHTML = '';

      globalData.forEach(cliente => {
        Object.values(cliente.subcarpetas).forEach(sub => {
          sub.modelos.forEach(m => {
            const imgSrc = (m.foto_url && m.foto_url.startsWith('http')) ? m.foto_url : "https://www.zebra.com/content/dam/zebra_new_ia/en-us/solutions-verticals/product-card/mobile-computers/handheld/tc27-card.png";
            
            const pdfButtonHTML = (m.pdf_url && m.pdf_url.startsWith('http')) ? `
              <a href="${m.pdf_url}" target="_blank" class="flex-1 w-full inline-flex items-center justify-center space-x-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 px-2 rounded-lg transition shadow-sm">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                <span class="truncate">PDF StageNow</span>
              </a>
            ` : `
              <button disabled class="flex-1 w-full inline-flex items-center justify-center space-x-1.5 bg-gray-200 text-gray-400 text-xs font-bold py-2.5 px-2 rounded-lg cursor-not-allowed">
                <span class="truncate">Sin PDF</span>
              </button>
            `;

            const archivosButtonHTML = (m.archivos_url && m.archivos_url.startsWith('http')) ? `
              <a href="${m.archivos_url}" target="_blank" class="flex-1 w-full inline-flex items-center justify-center space-x-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 px-2 rounded-lg transition shadow-sm">
                <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
                <span class="truncate">Archivos</span>
              </a>
            ` : '';

            grid.innerHTML += `
              <div class="profile-card bg-white border border-gray-200 rounded-xl p-5 shadow-sm flex flex-col justify-between">
                <div>
                  <div class="flex justify-between items-start mb-4 border-b border-gray-100 pb-3">
                    <div>
                      <span class="text-[11px] font-bold text-blue-600 uppercase">${cliente.nombre} > ${sub.nombre}</span>
                      <h3 class="text-xl font-bold text-gray-800">${m.nombre_modelo}</h3>
                    </div>
                  </div>
                  <div class="text-center bg-gray-50/50 p-3 rounded-lg border border-gray-100 mb-4 flex justify-center items-center h-48">
                    <img src="${imgSrc}" class="max-h-44 object-contain">
                  </div>
                  <div class="grid grid-cols-2 gap-3 text-xs text-gray-700 mb-5 bg-blue-50/30 p-4 rounded-lg border border-blue-50">
                    <div><span class="text-gray-400 block text-[10px] uppercase font-bold">Android</span> ${m.android}</div>
                    <div><span class="text-gray-400 block text-[10px] uppercase font-bold">Versión MX</span> ${m.mx}</div>
                    <div class="col-span-2"><span class="text-gray-400 block text-[10px] uppercase font-bold">Build</span> ${m.build}</div>
                    <div class="col-span-2"><span class="text-gray-400 block text-[10px] uppercase font-bold">Red Wi-Fi</span> ${m.wifi}</div>
                    <div class="col-span-2"><span class="text-gray-400 block text-[10px] uppercase font-bold">Apps / Extras</span> ${m.apps}</div>
                  </div>
                </div>
                <div class="flex flex-row space-x-2 mt-2 w-full">
                  ${pdfButtonHTML}
                  ${archivosButtonHTML}
                </div>
              </div>
            `;
          });
        });
      });
    }

    window.onload = loadGoogleSheetsData;
  </script>
</body>
</html>
